<html>

<head>
    <title>Example of Image Tag</title>
</head>

<body>
    <p>
    <h1><b><i><u>The Image</u></i></b></h1>
    <!-- Image Tag -->
    <!-- offline approach -->
    <a href="https://www.youtube.com" target="_blank"><img src="./assets/888.jpg" alt="Address Not found"
            title="This Is a Wallpaper" align="Right" height="500px" width="600px" /></a>

    <!-- online approach -->
    <a href="https://www.youtube.com/watch?v=oAVhUAaVCVQ&list=RDoAVhUAaVCVQ&start_radio=1" target="_blank"><img
            src="./assets/888.jpg" alt="Address not found" align="right" title="chammak challo" height="300PX"
            width="200px"></a>

    <video width="200px" height="200px" controls>
    <source src="./assets/360p-watermark.mp4">
    </video>

    <!-- Delete tag -->
     <p>Orignal Price <del >5000</del>  3000<sup><b text size = "50">15% Discount</b></sup></p>
     <p>New Price : 3000</p>
    </p>
    
    <form action=""></form>
</body>

</html>
