<!DOCTYPE html>
<html lang="en">

<head>
  <link rel="stylesheet" href="use-of-aline.css">

  <title>use of aline</title>
</head>

<body>
  <!-- flex-start -->
  <div class="contain1">
    <div class="box">box1</div>
    <div class="box">box2</div>
    <div class="box">box3</div>
    <h3 id="t1">flex-start</h3>
  </div>
  <!-- flex end -->
  <div class="contain2">
    <div class="box">box1</div>
    <div class="box">box2</div>
    <div class="box">box3</div>
    <h3 id="t2">flex-end</h3>
  </div>
  <!-- space around -->
  <div class="contain3">
    <div class="box">box1</div>
    <div class="box">box2</div>
    <h3 id="t3">space-around</h3>
    <div class="box">box3</div>
    <div class="box">box4</div>
    <div class="box">box5</div>
    <div class="box">box6</div>
    <div class="box">box7</div>
    <div class="box">box8</div>
  </div>
  <!-- space between -->

  <div class="contain4">
    <div class="box">box1</div>
    <div class="box">box2</div>
    <h3 id="t3">space-between</h3>
    <div class="box">box3</div>
    <div class="box">box4</div>
    <div class="box">box5</div>
    <div class="box">box6</div>
    <div class="box">box7</div>
    <div class="box">box8</div>
  </div>
  <!-- aline center -->
  <div class="contain5">
    <div class="box">box1</div>
    <div class="box">box2</div>
    <div class="box">box3</div>
    <div class="box">box4</div>
    <div class="box">box5</div>
    <div class="box">box6</div>
    <h3 id="t5">space-center</h3>
  </div>

  <!-- aline evenly -->
  <div class="contain6">
    <h3 id="t6">space-evenly</h3>
    <div class="box">box1</div>
    <div class="box">box2</div>
    <div class="box">box3</div>
    <div class="box">box4</div>
    <div class="box">box5</div>
    <div class="box">box6</div>
    <div class="box">box7</div>
    <div class="box">box8</div>
    <div class="box">box9</div>
    <div class="box">box10</div>
    <div class="box">box11</div>
    <div class="box">box12</div>


    <!-- <h3 id="t5">space-evenly</h3> -->
  </div>



</body>

</html>
